function generateRandomSpaces() {

    // إنشاء فاصل عشوائي بين الكلمات
    function mixSpaces() {
        let spaceMix = "";
        let totalLength = Math.floor(Math.random() * 10) + 3;

        for (let i = 0; i < totalLength; i++) {
            spaceMix += Math.random() > 0.5 ? " " : "_";
        }

        return spaceMix;
    }

    // إنشاء النص الجديد
    function createRandomText(words) {
        let result = "";

        for (let i = 0; i < words.length; i++) {
            result += words[i];

            if (i < words.length - 1) {
                result += mixSpaces();
            }
        }

        return result;
    }

        let originalText = btn.innerText;

        btn.innerText = "✅ تم النسخ ✅";

        setTimeout(() => {
            btn.innerText = originalText;
        }, 1500);
    }
</script>
